services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: care_analyzer
      POSTGRES_USER: care_analyzer
      POSTGRES_PASSWORD: care_analyzer_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_analyzer -d care_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
